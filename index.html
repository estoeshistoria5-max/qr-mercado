<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acercá tu QR al lector</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://use.typekit.net/proxima-nova-web-link-o-similar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
           font-family: "Proxima Nova", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #ffffff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        #flechaArriba {
            width: 38px;
            height: 38px;
            border-radius: 23%;
            background-color: #dbe8fa;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #flechaArriba svg {
            width: 20px;
            height: 20px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px 16px;
            background-color: #ffffff;
            overflow: hidden;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 24px;
            text-align: left;
            flex-shrink: 0;
        }

        .qr-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
            width: 100%;
        }

        .qr-container {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #e0e0e0;
            
            /* --- SOLUCIÓN PARA QUE NO SE DEFORME --- */
            aspect-ratio: 1 / 1; /* Fuerza siempre a ser cuadrado */
            width: min(100%, 45vh); /* Toma el ancho, pero nunca supera la mitad del alto de la pantalla */
            max-width: 350px; /* Tamaño máximo para tablets o pantallas grandes */
            flex-shrink: 0; /* Evita que flexbox lo aplaste asimétricamente */
        }

        #qrcode {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img, #qrcode canvas {
            width: 100% !important;
            height: 100% !important;
            /* El seguro de vida: hace que la imagen mantenga su relación de aspecto pase lo que pase */
            object-fit: contain !important; 
        }

        .bottom-section {
            background-color: #dfecf8;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            margin-bottom: 12vh;
            flex-shrink: 0;
            border-radius: 20px;
            position: relative;
        }

        .payment-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

       #logoM {
            width: 56px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #logoM img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .payment-text {
            display: flex;
            flex-direction: column;
        }

        .payment-label {
            font-size: 14px;
            color: #333333;
            line-height: 1.4;
        }

        .payment-method {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .change-btn {
            color: #0643e9;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            text-decoration: none;
        }

        #bolitaAmarilla {
            position: absolute;
            bottom: -30px; 
            right: 16px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #ffef0c -20%, #f7e43e 65%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(170, 170, 170, 0.2);
            cursor: pointer;
            border: none;
            outline: none;
            flex-shrink: 0;
            z-index: 10;
        }

        #bolitaAmarilla svg {
            width: 28px;
            height: 28px;
        }

        @media (max-width: 380px) {
            .title {
                font-size: 22px;
            }
            .qr-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="flechaArriba">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="#06479C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>

    <div class="main-content">
        <h1 class="title">Acercá tu QR al lector</h1>

        <div class="qr-wrapper">
            <div class="qr-container">
                <div id="qrcode"></div>
            </div>
        </div>

        <div class="bottom-section">
            <div class="payment-info">
                <div id="logoM">
                    <img src="mercado-pago-seeklogo.png" alt="Mercado Pago">
                </div>
                <div class="payment-text">
                    <span class="payment-label">Pagás con</span>
                    <span class="payment-method">Dinero disponible</span>
                </div>
            </div>
            
            <div class="change-btn">Cambiar <span style="margin-left:2px;">→</span></div>
            
            <button id="bolitaAmarilla" aria-label="Acciones">
                <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 16 4 L 18 12 L 26 14 L 18 16 L 16 24 L 14 16 L 6 14 L 14 12 Z" fill="#1a237e"/>
                    <path d="M 22 6 L 23 9 L 26 10 L 23 11 L 22 14 L 21 11 L 18 10 L 21 9 Z" fill="#1a237e"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const STATIC_PREFIX = "hQVDUFYwMWGCAUJPBTM2NTAyWghhJ3UhMXgP/4ACAAGBIIfGXDBlkW0XuU121zm4XrRgIb8JSc+4IZrDkljmkCtuggYmEAIZJQWDQIceiOGu/jx4iOlIBWKOM9ElYvP7YF3GJBHPQP99W6fshqye1RvMQ+kL3Vhrj8su2kebWUvq68wifkRpvhf3xQ6EBiYQARFB";
        const STATIC_MIDDLE = "UDAAB4hgEBhwECiAUzNjUwMp8IAgACY14BWWhRMDUyNjAwNTYyNDgzMTA2MzgxNjIxIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjMDMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIzEwAgEAmU";
        const B64_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

        function base32ToHex(base32) {
            const base32chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let bits = '';
            let hex = '';
            base32 = base32.toUpperCase().replace(/=+$/, '');
            for (let i = 0; i < base32.length; i++) {
                const val = base32chars.indexOf(base32.charAt(i));
                if (val === -1) throw new Error('Base32 inválido');
                bits += val.toString(2).padStart(5, '0');
            }
            for (let i = 0; i + 4 <= bits.length; i += 4) {
                hex += parseInt(bits.substr(i, 4), 2).toString(16);
            }
            return hex;
        }

        function generateTOTP(secret, period = 3) {
            const epoch = Math.floor(Date.now() / 1000);
            const time = Math.floor(epoch / period);
            const timeHex = time.toString(16).padStart(16, '0');
            const keyHex = base32ToHex(secret);
            const hmac = CryptoJS.HmacSHA1(CryptoJS.enc.Hex.parse(timeHex), CryptoJS.enc.Hex.parse(keyHex));
            const hmacBytes = hmac.toString();
            const offset = parseInt(hmacBytes.substr(hmacBytes.length - 1), 16) * 2;
            const binary = parseInt(hmacBytes.substr(offset, 8), 16) & 0x7fffffff;
            return (binary % 1000000).toString().padStart(6, '0');
        }

        function generateMockPayload() {
            const timeStep = Math.floor(Date.now() / 3000);
            const char1 = B64_CHARS[timeStep % 64];
            const char2 = B64_CHARS[(timeStep * 7 + 13) % 64];
            const timeStepB64 = char1 + char2;

            const fakeSecret = "CLONED_APP_SECRET_KEY_2024";
            const hash = CryptoJS.SHA512(timeStep.toString() + fakeSecret);
            const signatureB64 = hash.toString(CryptoJS.enc.Base64);

            return STATIC_PREFIX + timeStepB64 + STATIC_MIDDLE + signatureB64;
        }

        let qrCodeObj = null;

        function updateQR() {
            const payload = generateMockPayload();
            const qrContainer = document.getElementById('qrcode');

            if (qrCodeObj) {
                qrCodeObj.clear();
                qrCodeObj.makeCode(payload);
            } else {
                qrContainer.innerHTML = '';
                qrCodeObj = new QRCode(qrContainer, {
                    text: payload,
                    width: 360,
                    height: 360,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
        }

        updateQR();
        setInterval(updateQR, 3000);
    </script>
</body>
</html>
